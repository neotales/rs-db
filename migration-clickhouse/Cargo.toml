[package]
name = "neotales-migration-clickhouse"
description = "Explicit-recovery ClickHouse migrations over neotales-dbapi"
version = "0.0.0-alpha.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

[features]
experimental-native-migrations = []

[dependencies]
neotales-dbapi = { path = "../dbapi", version = "=0.0.0-alpha.0" }
neotales-dbapi-clickhouse = { path = "../dbapi-clickhouse", version = "=0.0.0-alpha.0" }
neotales-migration = { path = "../migration", version = "=0.0.0-alpha.0" }
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
getrandom.workspace = true
testcontainers = "=0.28.0"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
