[package]
name = "neotales-dbapi-mssql-direct"
description = "Experimental direct TDS SQL Server provider for neotales-dbapi"
version = "0.0.0-alpha.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[dependencies]
mssql-tds = { path = "vendor/mssql-tds-0.3.0", version = "=0.3.0", default-features = false }
neotales-dbapi = { path = "../dbapi", version = "=0.0.0-alpha.0" }
tokio = { workspace = true, features = ["sync", "time"] }
neotales-migration = { path = "../migration", version = "=0.0.0-alpha.0" }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
bollard = "=0.21.1"
futures-util = "0.3"
tar = "0.4"
log = "0.4"
mssql-tds = { path = "vendor/mssql-tds-0.3.0", version = "=0.3.0", default-features = false, features = ["test-util"] }
tracing = { version = "0.1", features = ["log-always"] }
getrandom.workspace = true
testcontainers = "=0.28.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "time"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
syn = { version = "2", features = ["full", "visit"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[lints]
workspace = true
