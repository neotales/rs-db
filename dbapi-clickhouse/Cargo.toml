[package]
name = "neotales-dbapi-clickhouse"
description = "Native-protocol ClickHouse provider for neotales-dbapi"
version = "0.0.0-alpha.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
neotales-dbapi = { path = "../dbapi", version = "=0.0.0-alpha.0" }
futures-util.workspace = true
klickhouse = { package = "neotales-klickhouse", path = "../klickhouse", version = "=0.0.0-alpha.0", default-features = false, features = ["tls"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "time"] }
tokio-rustls = "0.26"
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
futures-util.workspace = true
getrandom.workspace = true
klickhouse = { package = "neotales-klickhouse", path = "../klickhouse", version = "=0.0.0-alpha.0", default-features = false, features = ["tls"] }
rcgen.workspace = true
tempfile.workspace = true
testcontainers = "=0.28.0"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
