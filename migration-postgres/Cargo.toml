[package]
name = "neotales-migration-postgres"
description = "Locked transactional PostgreSQL migrations over quiet dbapi"
version = "0.0.0-alpha.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
neotales-dbapi = { path = "../dbapi", version = "=0.0.0-alpha.0" }
neotales-migration = { path = "../migration", version = "=0.0.0-alpha.0" }
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
neotales-dbapi-postgres = { path = "../dbapi-postgres", version = "=0.0.0-alpha.0" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[lints]
workspace = true
