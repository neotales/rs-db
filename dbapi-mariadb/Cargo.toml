[package]
name = "neotales-dbapi-mariadb"
description = "MariaDB provider for neotales-dbapi"
version = "0.0.0-alpha.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
neotales-dbapi = { path = "../dbapi", version = "=0.0.0-alpha.0" }
neotales-dbapi-mysql = { path = "../dbapi-mysql", version = "=0.0.0-alpha.0" }

[dev-dependencies]
futures-util.workspace = true
getrandom.workspace = true
testcontainers = "=0.28.0"
tempfile = "3.24"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
