[package]
name = "d1-emulator-worker"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
futures-core = "0.3"
neotales-dbapi = { path = "../../../dbapi" }
