[package]
name = "neotales-dbapi-libsql"
description = "Remote libSQL/Turso provider for neotales-dbapi"
version = "0.0.0-alpha.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
neotales-dbapi = { path = "../dbapi", version = "=0.0.0-alpha.0" }
libsql = { package = "neotales-libsql", path = "../libsql", version = "=0.0.0-alpha.0", default-features = false, features = ["remote", "tls"] }
tokio.workspace = true
tracing = "0.1"
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
futures-util.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3", features = ["registry"] }

[lints]
workspace = true
