[package]
name = "neotales-migration-libsql"
description = "Transactional remote libSQL/Turso backend for neotales-migration"
version = "0.0.0-alpha.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
neotales-migration = { path = "../migration", version = "=0.0.0-alpha.0" }
neotales-dbapi = { path = "../dbapi", version = "=0.0.0-alpha.0" }
neotales-dbapi-libsql = { path = "../dbapi-libsql", version = "=0.0.0-alpha.0" }
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
