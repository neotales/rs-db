[package]
name = "neotales-dbapi-postgres-tls"
description = "Experimental verified TLS adapter for the isolated PostgreSQL driver"
version = "0.0.0-alpha.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
neotales-tokio-postgres = { path = "../tokio-postgres", version = "=0.0.0-alpha.0" }
openssl = "0.10"
tokio = { workspace = true, features = ["io-util"] }
tokio-openssl = "0.6"

[dev-dependencies]
log = "0.4"
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[lints]
workspace = true
