# Supply chain policy for this repository.
#
# Copied from the plab rs-lib workspace with the two RUSTSEC ignores removed.
# Those entries name neotales-x509 and neotales-docker-compose, which are not in
# this repository, so keeping them here would pre-approve an advisory for a
# crate that may later pull the same dependency for a different reason. An
# ignore belongs in the repository it was reasoned about.
#
# If a crate in this repository needs an ignore, add it here with a reason and a delete
# condition, and never as a way to make a red build green. `cargo audit` reads
# no config file, so the same ignore must also be repeated in audit.yml as an
# `--ignore` flag. Two places, one reason: the reason and the delete condition
# live here, next to the graph they were reasoned about.

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "transitive"
ignore = [
  # rustc-serialize is reachable only through the optional `with-eui48-0_4`
  # compatibility feature of the vendored tokio-postgres fork. No crate here
  # enables that feature. Delete both entries when postgres-types drops eui48
  # 0.4, or when the fork genuinely needs that feature.
  { id = "RUSTSEC-2025-0025", reason = "unmaintained rustc-serialize is behind the unused with-eui48-0_4 feature of the tokio-postgres fork" },
  { id = "RUSTSEC-2022-0004", reason = "rustc-serialize stack overflow is behind the unused with-eui48-0_4 feature of the tokio-postgres fork" },
  # sqlx 0.9.0 caps libsqlite3-sys below 0.38. The first patched release is
  # 0.39, which needs sqlx 0.9.1. sqlx 0.9.1 needs time >=0.3.48, while the
  # vendored mssql-tds manifest pins time =0.3.47. Delete this entry when
  # sqlx is upgraded to 0.9.1, rusqlite to 0.41, and the mssql-tds time pin is
  # relaxed in a reviewed vendor update.
  { id = "RUSTSEC-2026-0459", reason = "sqlx 0.9.0 caps libsqlite3-sys <0.38; the patched 0.39 requires sqlx 0.9.1, which conflicts with the vendored mssql-tds time pin" },
  # testcontainers 0.28.0 is the newest release and depends on
  # astral-tokio-tar, which Astral deprecated in November 2026. This is a
  # dev-dependency of live lanes. Delete when testcontainers moves off it.
  { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar is a dev-only dependency of testcontainers 0.28.0, the newest release" },
  # chrono is a hard dependency of chrono-tz in the klickhouse fork's timezone
  # support. There is no maintained drop-in with the same tz database API.
  # Delete when the fork moves off chrono-tz or chrono is maintained again.
  { id = "RUSTSEC-2026-0543", reason = "chrono is required by chrono-tz in the klickhouse fork; no maintained drop-in exists" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # webpki-roots ships the CA bundle under this permissive data licence.
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
