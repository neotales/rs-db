[package]
name = "neotales-dbapi-mysql"
description = "MySQL provider for neotales-dbapi"
version = "0.0.0-alpha.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
neotales-dbapi = { path = "../dbapi", version = "=0.0.0-alpha.0" }
futures-util.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql-rsa", "tls-rustls-ring"] }
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
getrandom.workspace = true
testcontainers = "=0.28.0"
tempfile = "3.24"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
